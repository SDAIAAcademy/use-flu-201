<section>
<h2>اليوم 1: أربع عادات: فوِّض وصِف واحكم وتحمَّل</h2>
<ol>
<li><p>تعدّ تقريرًا شهريًّا لمديرك. خطوة فيه: مطابقة كل رقم في المسودة على نظام المالية. المسودة كتبها المساعد المعتمد من جدول أعطيته إياه. إلى من تسند المطابقة؟</p><ul><li><b>أ.</b> إلى المساعد نفسه، في المحادثة نفسها</li><li><b>ب.</b> إلى مساعد عام آخر، ليكون الفحص مستقلًّا</li><li><b>ج.</b> إليك أنت، لأن التقرير يخرج باسمك</li><li><b>د.</b> إلى لا أحد، فالجدول أُعطي للمساعد صحيحًا</li></ul></li>
<li><p>تريد أن يستخرج المساعد المعتمد المواعيد النهائية من محاضر الاجتماعات، وهو نوع لم تجرّبه معه. أي خطوة أولى تصلح اختبارًا؟</p><ul><li><b>أ.</b> تعطيه محضرًا استخرجتَ مواعيده بنفسك الشهر الماضي، وتقارن</li><li><b>ب.</b> تسأله: هل تتقن استخراج المواعيد من المحاضر؟</li><li><b>ج.</b> تعطيه محضر هذا الأسبوع وتقرأ ما يستخرجه</li><li><b>د.</b> تعتمد عليه، فقد أحسن تلخيص المحاضر من قبل</li></ul></li>
<li><p>كتب زميلك للمساعد المعتمد: «أنا منسق تدريب. اكتب رسالة لمديري الأقسام عن لائحة التدريب الجديدة، في نصف صفحة وبلغة رسمية.» جاء الرد منسّقًا ومهذبًا، وفيه شرط حضور نسبته 80% ليس في اللائحة. ما الذي كان سيمنع هذا؟</p><ul><li><b>أ.</b> وصف أدق لدوره ولدور القراء</li><li><b>ب.</b> قيد أشد على طول الرسالة</li><li><b>ج.</b> أن يطلب منه التأكد من دقة ما يكتب</li><li><b>د.</b> نص اللائحة في الطلب، ومعيار: لا شيء من خارج النص</li></ul></li>
<li><p>كتب لك المساعد ملخصًا لتقرير من عشر صفحات ألصقته له. الملخص سلس، لكنك تشعر أنه «ليس ما تريد». معك معايير كتبتها قبل الطلب. ما أنفع جولة تالية؟</p><ul><li><b>أ.</b> «حسّن الملخص واجعله أقوى»</li><li><b>ب.</b> «انقد الملخص وفق هذه المعايير، معيارًا معيارًا، قبل أن تعيد كتابته»</li><li><b>ج.</b> محادثة جديدة بالطلب نفسه حرفيًّا</li><li><b>د.</b> «هل أنت راضٍ عن هذا الملخص؟»</li></ul></li>
<li><p>وصلتك مذكرة من صفحة كتبها مساعد عن لائحة الإجازات: عناوين واضحة، وجدول، وثلاثة أرقام مواد. ستوقّعها بعد ربع ساعة، ونص اللائحة عندك. بأي شيء تبدأ؟</p><ul><li><b>أ.</b> تفتح اللائحة، وتطابق عليها كل رقم ورقم مادة، ثم تقرأ كل مادة مستشهد بها كاملة</li><li><b>ب.</b> تقرأ المذكرة مرتين بتأنٍّ بحثًا عن جملة غير مستقيمة</li><li><b>ج.</b> تسأل المساعد نفسه: هل في المذكرة أخطاء؟</li><li><b>د.</b> توقّعها، فتنسيقها وأرقام موادها تدل على أنها من النص</li></ul></li>
<li><p>يطلب منك مديرك ردًّا مكتوبًا على تظلّم موظف من قرار إداري، يُرسل غدًا باسم الإدارة. ملف التظلم فيه بيانات الموظف، ومعك المساعد المعتمد في جهتك. ما القرار الأقرب إلى الصواب؟</p><ul><li><b>أ.</b> استخدام: يكتب المساعد الرد من الملف وتراجعه لغويًّا</li><li><b>ب.</b> استخدام دون إفصاح، فالرد قصير ولن يسأل أحد</li><li><b>ج.</b> تقييد: مضمون الرد يقرره صاحب الاختصاص، ويعين المساعد في الصياغة من نقاط بلا بيانات تعرّف بالموظف</li><li><b>د.</b> رفض: لا يُستخدم مساعد في أي شيء يخص الموظفين</li></ul></li>
<li><p>تعدّين محضر اجتماع أسبوعي: تسجيل النقاط، وصياغة المحضر، ومطابقة القرارات على ما قيل، وإرساله باسمك. تسألين: «هل أستخدم المساعد في المحضر؟» ما أنفع إعادة صياغة للسؤال؟</p><ul><li><b>أ.</b> هل المساعد المعتمد عندنا جيد في المحاضر عمومًا؟</li><li><b>ب.</b> من يؤدي كل خطوة من الأربع، ولماذا؟</li><li><b>ج.</b> كم دقيقة يوفر المساعد في المحضر كله؟</li><li><b>د.</b> هل يستخدم زملائي المساعد في محاضرهم؟</li></ul></li>
<li><p>في مهمة إعداد عرض عن نتائج استطلاع رضا الموظفين خطوة تقول: «إضافة أسماء أصحاب التعليقات السلبية ليتابعهم المدير». الاستطلاع وُعد المشاركون فيه بأنه مجهول. إلى من تُسند الخطوة؟</p><ul><li><b>أ.</b> إلى الشخص، لأن الأسماء سرية ولا تدخل المساعد</li><li><b>ب.</b> إلى المساعد المعتمد، فهو مصرح له بالبيانات المقيدة</li><li><b>ج.</b> إليهما معًا: المساعد يستخرج والشخص يراجع</li><li><b>د.</b> إلى لا أحد: الخطوة لا تُفعل، ويُبلَّغ المدير بالسبب</li></ul></li>
<li><p>كتب زميل في بطاقة التفويض أمام خطوة «تلخيص عقد التوريد للمدير»: «المساعد، لأنه أسرع مني». أي تعليق يصلح سببًا مكان هذا؟</p><ul><li><b>أ.</b> المساعد، لأنه لا يتعب من القراءة الطويلة</li><li><b>ب.</b> المساعد، لأن المدير لا يقرأ التفاصيل على أي حال</li><li><b>ج.</b> معًا: يلخص المساعد في الأداة المعتمدة، وأطابق كل مبلغ ومدة على العقد لأن المدير يقرر عليها</li><li><b>د.</b> الشخص، لأن العقود لا يجوز أن يقرأها مساعد أبدًا</li></ul></li>
<li><p>طلبتَ من المساعد المعتمد: «اكتب دليلًا مختصرًا للموظفين الجدد عن نظام الحضور». جاء الدليل مرتبًا، وفيه مهلة سماح مدتها عشر دقائق ليست في لائحة جهتك. ما الذي ينقص الطلب أولًا؟</p><ul><li><b>أ.</b> نص لائحة الحضور، مع قيد: لا شيء من خارج النص</li><li><b>ب.</b> تحديد أدق لعدد الكلمات والعناوين</li><li><b>ج.</b> طلب أن يكتب بلغة أكثر رسمية</li><li><b>د.</b> وصف أوفى لخبرة الموظفين الجدد</li></ul></li>
<li><p>لماذا تُكتب معايير النجاح قبل إرسال الطلب، لا بعد قراءة المخرج؟</p><ul><li><b>أ.</b> لأن المساعد يرفض الطلب الذي لا معايير فيه</li><li><b>ب.</b> لأن المعايير تطيل الطلب، والطلب الطويل أفضل دائمًا</li><li><b>ج.</b> لأن كتابتها بعد المخرج أسرع وأدق</li><li><b>د.</b> لأن من يكتبها بعد المخرج يكتب ما يوافق ما رآه</li></ul></li>
<li><p>أعطاك المساعد مسودة رسالة للموردين وفق طلب فيه معايير. المسودة أطول من القيد، وتنقصها مهلة الرد. ما أنفع جولة تالية؟</p><ul><li><b>أ.</b> «أعد المحاولة» دون تفصيل</li><li><b>ب.</b> «الرسالة 260 كلمة والقيد 180، وتنقصها مهلة الرد من البند 4. عالج هذين وحدهما»</li><li><b>ج.</b> محادثة جديدة بالطلب نفسه حرفيًّا</li><li><b>د.</b> «هل ترى أن الرسالة تستوفي المعايير؟»</li></ul></li>
<li><p>صحّحتَ للمساعد اسم الإدارة مرتين في محادثة طويلة، ثم عاد إلى الاسم القديم في جدول طلبته. ما القرار الأنسب؟</p><ul><li><b>أ.</b> تصحيح ثالث بصيغة أشد</li><li><b>ب.</b> قبول الجدول وتصحيح الاسم يدويًّا في كل مرة</li><li><b>ج.</b> محادثة جديدة بطلب يحمل الاسم الصحيح وما ثبتت صحته فقط</li><li><b>د.</b> ترك المساعد لأنه لا يصلح لهذه المهمة</li></ul></li>
<li><p>تريدين أن يحوّل المساعد المعتمد كشوف الحضور إلى ملخص شهري بالنسب، وهو نوع لم تجربيه معه. أي اختبار يصلح قبل الاعتماد عليه؟</p><ul><li><b>أ.</b> كشف الشهر الماضي الذي حسبتِ ملخصه بنفسك، ثم مقارنة سطرًا بسطر</li><li><b>ب.</b> كشف هذا الشهر، ثم قراءة الملخص للتأكد من أنه معقول</li><li><b>ج.</b> سؤال المساعد: كم نسبة دقتك في حساب النسب؟</li><li><b>د.</b> تجربته على تلخيص تقرير نصي، فقد أحسن فيه سابقًا</li></ul></li>
<li><p>قارن زميلك ملخص المساعد بالإجابة المرجعية، فوجد الإجمالي مطابقًا وكتب: «مطابق، يُفوَّض». ما الخلل في تجربته؟</p><ul><li><b>أ.</b> لا خلل: الإجمالي أهم رقم، وصحته تكفي</li><li><b>ب.</b> كان عليه أن يعيد الطلب ثلاث مرات ويأخذ الأغلب</li><li><b>ج.</b> كان عليه أن يسأل المساعد عن ثقته بالأرقام</li><li><b>د.</b> قارن سطرًا واحدًا من ثمانية، فلا يعرف حال السبعة الباقية</li></ul></li>
<li><p>اختبرتَ المساعد على استخراج البنود المالية من عروض الأسعار: أصاب في الوصف والكميات في كل العروض، وأخطأ في ضريبة القيمة المضافة في عرضين من خمسة. ما القرار المعلَّل؟</p><ul><li><b>أ.</b> تفويض كامل: أصاب في أكثر البنود</li><li><b>ب.</b> تقييد: يستخرج الوصف والكميات، وأحسب الضريبة والإجمالي بنفسي</li><li><b>ج.</b> احتفاظ بالمهمة كلها: من يخطئ في جزء لا يؤتمن على شيء</li><li><b>د.</b> تفويض كامل بعد تنبيهه: «انتبه للضريبة»</li></ul></li>
<li><p>في مذكرة كتبها مساعد عن لائحة المشتريات: «بحسب المادة 31، تُعفى المشتريات دون 5,000 ريال من ثلاثة عروض». اللائحة عندك 24 مادة. ما نوع الخطأ، وما المصدر الذي يكشفه؟</p><ul><li><b>أ.</b> سياق ناقص، ويكشفه سؤال المساعد عن بقية المادة</li><li><b>ب.</b> استدلال معيب، ويكشفه إعادة الحساب</li><li><b>ج.</b> مختلق، ويكشفه فهرس اللائحة: لا مادة برقم 31</li><li><b>د.</b> لا خطأ: قد تكون المادة أُضيفت في تعديل لم يصلني</li></ul></li>
<li><p>نص اللائحة: «يُرد على الطلب خلال 5 أيام عمل من اكتمال مستنداته». كتب المساعد في الأسئلة الشائعة: «يُرد على الطلب خلال 5 أيام». ما الوصف الأدق؟</p><ul><li><b>أ.</b> لا خطأ: المعنى واحد والصياغة أخصر</li><li><b>ب.</b> سياق ناقص: سقط قيدان يغيّران المهلة</li><li><b>ج.</b> مختلق: الرقم 5 ليس في اللائحة</li><li><b>د.</b> موافقة على مقدمة خاطئة من السائل</li></ul></li>
<li><p>تريد أن تعرف هل تغيّرت مهلة الاعتراض في اللائحة الجديدة، وتظن أنها قُصّرت. نص اللائحة أمام المساعد. أي صيغة للسؤال تحميك من موافقته على ظنك؟</p><ul><li><b>أ.</b> «بما أن مهلة الاعتراض قُصّرت، اكتب تنبيهًا بذلك»</li><li><b>ب.</b> «أليس صحيحًا أن مهلة الاعتراض قُصّرت؟»</li><li><b>ج.</b> «أنا متأكد أن المهلة قُصّرت، أكّد لي ذلك»</li><li><b>د.</b> «ماذا تقول اللائحتان عن مهلة الاعتراض؟ اذكر المادة ونصها في كل منهما»</li></ul></li>
<li><p>مشرفة تريد أن يكتب مساعد عام على هاتفها خطاب إنذار لموظفة تكرر غيابها، وتلصق له سجل الغياب وملاحظاتها. ما القرار الأقرب إلى الصواب؟</p><ul><li><b>أ.</b> استخدام: الخطاب قالب معروف والمساعد يتقنه</li><li><b>ب.</b> استخدام بعد حذف اسم الموظفة فقط</li><li><b>ج.</b> رفض هذا الاستخدام، والرجوع إلى الموارد البشرية لنموذج الخطاب وإجراءاته</li><li><b>د.</b> استخدام، مع ملاحظة إفصاح في آخر الخطاب</li></ul></li>
<li><p>تقرير سنوي عام اعتُمد للنشر، ويُطلب نشره بالإنجليزية بعد ثلاثة أيام. المترجم غائب، والمساعد المعتمد متاح، وفي الإدارة زميلة تتقن اللغتين. ما القرار المعلَّل؟</p><ul><li><b>أ.</b> رفض: الترجمة للنشر لا يقربها مساعد</li><li><b>ب.</b> استخدام بلا مراجعة: النص عام فلا خطر فيه</li><li><b>ج.</b> استخدام بمراجعة يقوم بها المساعد نفسه في محادثة ثانية</li><li><b>د.</b> استخدام: يترجم المساعد، وتطابق الزميلة كل رقم ومصطلح على العربي، ويُفصح عن ذلك</li></ul></li>
<li><p>قررتَ ألا يكتب المساعد ردًّا قانونيًّا على مطالبة مورّد، وأن يُحال إلى المستشار القانوني. يعترض زميل: «الوقت ضيق، والمساعد يكتب أحسن منا». أي رد يدافع عن القرار؟</p><ul><li><b>أ.</b> «معك حق، لنكتبه بالمساعد ونراجعه نحن»</li><li><b>ب.</b> «الرد له أثر تعاقدي ويُسأل عنه المستشار. أجهّز له الوقائع الآن ليختصر وقته»</li><li><b>ج.</b> «سياسة الجهة تمنع المساعد في كل شيء»</li><li><b>د.</b> «المساعدات تخطئ دائمًا في القانون»</li></ul></li>
<li><p>كتب زميل تحت تقريره: «استُخدم المساعد المعتمد في صياغة هذا التقرير وترتيبه. المسؤول: خالد، محلل الأداء». أي نقطة من نقاط الإفصاح الثلاث تنقصه؟</p><ul><li><b>أ.</b> ما فعله المساعد</li><li><b>ب.</b> من المسؤول</li><li><b>ج.</b> ما تحقق منه الكاتب، وعلى أي مصدر</li><li><b>د.</b> اسم الشركة التي صنعت المساعد</li></ul></li>
<li><p>أي ملاحظة إفصاح تستوفي النقاط الثلاث لملخص محضر أعدّه مساعد وراجعتَه؟</p><ul><li><b>أ.</b> «لخّص المساعد المعتمد المحضر من تسجيله المكتوب. طابقتُ القرارات الخمسة والمواعيد على المحضر الأصلي. المسؤول عن الملخص: منى، منسقة اللجنة»</li><li><b>ب.</b> «أُعدّ هذا الملخص بمساعدة الذكاء الاصطناعي وقد يحتوي على أخطاء»</li><li><b>ج.</b> «هذا الملخص من إعداد المساعد المعتمد، وهو المسؤول عن دقته»</li><li><b>د.</b> «راجعتُ الملخص بعناية. منى، منسقة اللجنة»</li></ul></li>
<li><p>طلب منك زميل بيانات لعرضه. طلبتَ من المساعد جدولًا من تقرير طويل، وخرج الجدول أنيقًا، وموعد زميلك بعد عشر دقائق. ما التصرف الذي يتفق مع «العمل باسمك»؟</p><ul><li><b>أ.</b> ترسله كما هو، فالتنسيق يدل على العناية</li><li><b>ب.</b> ترسله مع عبارة «من المساعد، لم أراجعه»</li><li><b>ج.</b> تطابق أرقام الجدول على التقرير، وترسله مع ما طابقتَه وما لم تطابقه</li><li><b>د.</b> لا ترسل شيئًا، وتعتذر بضيق الوقت</li></ul></li>
</ol>

ؤال هنا عرض افتراضًا ليوافقه المساعد"],"lo":["LO4"],"day":1,"session":5,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-lo4-wrong-premise","type":"single","prompt":"تريد أن تعرف هل تغيّرت مهلة الاعتراض في اللائحة الجديدة، وتظن أنها قُصّرت. نص اللائحة أمام المساعد. أي صيغة للسؤال تحميك من موافقته على ظنك؟","options":[{"key":"أ","text":"«بما أن مهلة الاعتراض قُصّرت، اكتب تنبيهًا بذلك»"},{"key":"ب","text":"«أليس صحيحًا أن مهلة الاعتراض قُصّرت؟»"},{"key":"ج","text":"«أنا متأكد أن المهلة قُصّرت، أكّد لي ذلك»"},{"key":"د","text":"«ماذا تقول اللائحتان عن مهلة الاعتراض؟ اذكر المادة ونصها في كل منهما»"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"السؤال المحايد لا يعرض استنتاجًا، ويطلب المادة ونصها، فيصير الجواب قابلًا للمطابقة.","misconceptions":["يعرض الظن مقدمة مسلّمة: المساعد يميل إلى البناء عليها لا التحقق منها","يسأل سؤالًا يوحي بجوابه: صيغة «أليس» تدعو إلى الموافقة","يطلب التأكيد صراحة: يحصل على ما طلب لا على ما في النص",""],"lo":["LO4"],"day":1,"session":5,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo5-appraisal","type":"single","prompt":"مشرفة تريد أن يكتب مساعد عام على هاتفها خطاب إنذار لموظفة تكرر غيابها، وتلصق له سجل الغياب وملاحظاتها. ما القرار الأقرب إلى الصواب؟","options":[{"key":"أ","text":"استخدام: الخطاب قالب معروف والمساعد يتقنه"},{"key":"ب","text":"استخدام بعد حذف اسم الموظفة فقط"},{"key":"ج","text":"رفض هذا الاستخدام، والرجوع إلى الموارد البشرية لنموذج الخطاب وإجراءاته"},{"key":"د","text":"استخدام، مع ملاحظة إفصاح في آخر الخطاب"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"ثلاث علامات اجتمعت: قرار في حق شخص، وبيانات تعرّف به، وأداة غير معتمدة. والرفض يأتي معه البديل.","misconceptions":["ينظر إلى المهارة وحدها: السجل بيانات موظفة في أداة غير معتمدة، والإنذار قرار له أثر عليها","يظن أن حذف الاسم يكفي: السجل والملاحظات تعرّف بها، والأداة ما زالت غير معتمدة","","يظن أن الإفصاح يجيز ما لا يجوز: الإفصاح يصف عملًا مسموحًا ولا يصحّح مخالفة"],"lo":["LO5"],"day":1,"session":6,"slide":null,"level":"evaluate","pool":"practice"},{"id":"q-lo5-translation","type":"single","prompt":"تقرير سنوي عام اعتُمد للنشر، ويُطلب نشره بالإنجليزية بعد ثلاثة أيام. المترجم غائب، والمساعد المعتمد متاح، وفي الإدارة زميلة تتقن اللغتين. ما القرار المعلَّل؟","options":[{"key":"أ","text":"رفض: الترجمة للنشر لا يقربها مساعد"},{"key":"ب","text":"استخدام بلا مراجعة: النص عام فلا خطر فيه"},{"key":"ج","text":"استخدام بمراجعة يقوم بها المساعد نفسه في محادثة ثانية"},{"key":"د","text":"استخدام: يترجم المساعد، وتطابق الزميلة كل رقم ومصطلح على العربي، ويُفصح عن ذلك"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"النص عام ومعتمد، والمساعد يتقن النوع، والأصل العربي إجابة معروفة. الشرط إنسان يراجع ويُسأل، وملاحظة إفصاح.","misconceptions":["يرفض حيث يكفي شرط: النص عام، والمهارة مما يتقنه المساعد، والعربي المعتمد إجابة تُطابق عليها","يخلط التصنيف بالدقة: «عام» يجيز دخوله الأداة، ولا يضمن صحة رقم مترجم يُنشر باسم الجهة","يجعل كاتب الترجمة مراجعها: الخطأ الذي وقع فيه مرة قد يمر عليه مرة ثانية",""],"lo":["LO5"],"day":1,"session":6,"slide":null,"level":"evaluate","pool":"practice"},{"id":"q-lo5-objection","type":"single","prompt":"قررتَ ألا يكتب المساعد ردًّا قانونيًّا على مطالبة مورّد، وأن يُحال إلى المستشار القانوني. يعترض زميل: «الوقت ضيق، والمساعد يكتب أحسن منا». أي رد يدافع عن القرار؟","options":[{"key":"أ","text":"«معك حق، لنكتبه بالمساعد ونراجعه نحن»"},{"key":"ب","text":"«الرد له أثر تعاقدي ويُسأل عنه المستشار. أجهّز له الوقائع الآن ليختصر وقته»"},{"key":"ج","text":"«سياسة الجهة تمنع المساعد في كل شيء»"},{"key":"د","text":"«المساعدات تخطئ دائمًا في القانون»"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"الدفاع يسمّي السبب، وهو هنا المساءلة وأثر النص، ويقدّم بديلًا يعالج ضيق الوقت. الاستعجال لا ينقل المساءلة.","misconceptions":["يتراجع أمام الاستعجال: لا أحد منكما يملك أن يكتشف مادة نظامية مختلقة","","يحتج بمنع لا وجود له: يضعف القرار حين يُكتشف أن المنع ليس عامًّا","يعمّم بلا دليل: الحجة هي المساءلة وغياب إجابة معروفة، لا أن المساعد يخطئ دائمًا"],"lo":["LO5"],"day":1,"session":6,"slide":null,"level":"evaluate","pool":"practice"},{"id":"q-lo6-three-points","type":"single","prompt":"كتب زميل تحت تقريره: «استُخدم المساعد المعتمد في صياغة هذا التقرير وترتيبه. المسؤول: خالد، محلل الأداء». أي نقطة من نقاط الإفصاح الثلاث تنقصه؟","options":[{"key":"أ","text":"ما فعله المساعد"},{"key":"ب","text":"من المسؤول"},{"key":"ج","text":"ما تحقق منه الكاتب، وعلى أي مصدر"},{"key":"د","text":"اسم الشركة التي صنعت المساعد"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"القارئ يسأل: بماذا أثق؟ وجوابه في ما راجعه الكاتب وعلى أي مصدر. إفصاح بلا هذه النقطة لا يقول له شيئًا.","misconceptions":["النقطة موجودة: «صياغة التقرير وترتيبه»","النقطة موجودة: الاسم والدور مذكوران","","يطلب ما ليس من النقاط الثلاث: القارئ يحتاج إلى ما يثق به، لا إلى اسم المورّد"],"lo":["LO6"],"day":1,"session":6,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-lo6-best-note","type":"single","prompt":"أي ملاحظة إفصاح تستوفي النقاط الثلاث لملخص محضر أعدّه مساعد وراجعتَه؟","options":[{"key":"أ","text":"«لخّص المساعد المعتمد المحضر من تسجيله المكتوب. طابقتُ القرارات الخمسة والمواعيد على المحضر الأصلي. المسؤول عن الملخص: منى، منسقة اللجنة»"},{"key":"ب","text":"«أُعدّ هذا الملخص بمساعدة الذكاء الاصطناعي وقد يحتوي على أخطاء»"},{"key":"ج","text":"«هذا الملخص من إعداد المساعد المعتمد، وهو المسؤول عن دقته»"},{"key":"د","text":"«راجعتُ الملخص بعناية. منى، منسقة اللجنة»"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"الملاحظة تصف طريقة العمل في ثلاث جمل: ما فعله المساعد وبأي مادة، وما رُوجع وعلى أي مصدر، ومن يُسأل.","misconceptions":["","يظن أن التحذير العام إفصاح: لا يقول ما فعله المساعد ولا ما رُوجع، وينقل عبء الفحص إلى القارئ","ينقل المساءلة إلى الأداة: المسؤول هو من أرسل الملخص باسمه","يذكر المراجعة ويخفي دور المساعد: القارئ لا يعرف أي جزء صاغته أداة ولا على ماذا رُوجع"],"lo":["LO6"],"day":1,"session":6,"slide":null,"level":"evaluate","pool":"practice"},{"id":"q-lo6-pass-on","type":"single","prompt":"طلب منك زميل بيانات لعرضه. طلبتَ من المساعد جدولًا من تقرير طويل، وخرج الجدول أنيقًا، وموعد زميلك بعد عشر دقائق. ما التصرف الذي يتفق مع «العمل باسمك»؟","options":[{"key":"أ","text":"ترسله كما هو، فالتنسيق يدل على العناية"},{"key":"ب","text":"ترسله مع عبارة «من المساعد، لم أراجعه»"},{"key":"ج","text":"تطابق أرقام الجدول على التقرير، وترسله مع ما طابقتَه وما لم تطابقه"},{"key":"د","text":"لا ترسل شيئًا، وتعتذر بضيق الوقت"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"ما لم تراجعه ينتقل عمله إلى من يستلمه. عشر دقائق تكفي لمطابقة جدول، والإفصاح يقول لزميلك حدود ما يعتمد عليه.","misconceptions":["يقرأ الشكل دليلًا على الصحة: الجدول الأنيق قد يحمل رقمًا منقولًا خطأ","يظن أن التنبيه يعفيه: نقل عبء المراجعة إلى زميل لا وقت عنده، والعمل ما زال منك","","يترك زميله بلا شيء حيث تكفي عشر دقائق لمطابقة جدول: الرفض هنا بلا سبب من الثلاثة"],"lo":["LO6"],"day":1,"session":6,"slide":null,"level":"apply","pool":"practice"}]}</script>
